<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Chrome on Android shrinks the page for the soft keyboard, so 100dvh is what is above it -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <!-- The hub writes the sub-path a reverse proxy serves it under here (X-Forwarded-Prefix, docs/web/web.md "Sub-path"):
         the bundle's files and the links below are relative to it, and lib/base.ts reads it for everything else. -->
    <base href="/" />
    <link rel="icon" href="app-icon-64.png" type="image/png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="app-icon-dark-64.png" type="image/png" media="(prefers-color-scheme: dark)" />
    <!-- Installable as an app (PWA, docs/web/web.md "Install as an app"). The theme colours are --page of styles.css. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#f1f1f4" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Persona" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Persona</title>
    <!-- --page, light and dark: the page before the CSS bundle is in (the script below sets .dark first) -->
    <style>html{background:#f1f1f4}html.dark{background:#0b0b0c}html[data-surface-style="liquid-glass"]{background:transparent}</style>
    <script src="compatibility-bootstrap.js"></script>
    <script>
      // Pick the theme before the first paint so a dark page never flashes white.
      try {
        var t = localStorage.getItem("persona.theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        // A theme picked in Settings also colours the browser's / installed app's bar (views/theme.ts does the same later).
        if (t !== "system") {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
            m.media = m.dataset.scheme === t ? "all" : "not all";
          });
        }
        // text size (src/ui/look.ts) too, so the first paint is at its size.
        var size = localStorage.getItem("persona.text-size");
        if (size === "small" || size === "large") document.documentElement.dataset.textSize = size;
        // surface style (src/ui/look.ts): opt-in Liquid Glass before first paint.
        if (localStorage.getItem("persona.surface-style") === "liquid-glass") {
          document.documentElement.dataset.surfaceStyle = "liquid-glass";
          var desktop = window.personaDesktop;
          if (desktop && desktop.platform === "darwin" && typeof desktop.setSurfaceStyle === "function") {
            document.documentElement.dataset.desktopGlass = "1";
          }
          var gt = Number(localStorage.getItem("persona.glass-translucency"));
          var g = Number.isFinite(gt) && localStorage.getItem("persona.glass-translucency") ? Math.round(Math.min(100, Math.max(0, gt))) : 75;
          document.documentElement.style.setProperty("--glass-t", (g / 100).toFixed(2));
        }
      } catch (e) {}
    </script>
    <script>
      // Cached font choices before first paint. Keep in sync with ui/font-preference.ts (contract-tested).
      (function () {
        function refreshFonts() {
          var fonts;
          try { fonts = JSON.parse(localStorage.getItem("persona.font") || "null"); }
          catch (e) { fonts = null; }
          var presets = { sans: { inter: "Inter", system: "system-ui", georgia: "Georgia", sourceHan: "Source Han Serif SC" }, mono: { jetbrains: "JetBrains Mono", system: "ui-monospace", sfMono: "SF Mono", fira: "Fira Code", cascadia: "Cascadia Code", menlo: "Menlo", consolas: "Consolas" } };
          var fallbacks = {
            sans: 'Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif',
            mono: '"JetBrains Mono", "SF Mono", "DejaVu Sans Mono", "Liberation Mono", ui-monospace, Menlo, Consolas, monospace'
          };
          var declarations = [];
          var prose = "";
          ["sans", "mono"].forEach(function (kind) {
            var choice = fonts && typeof fonts === "object" && fonts[kind];
            if (!choice || typeof choice !== "object") return;
            if (kind === "sans" && choice.preset === "serif") {
              prose = '.prose-j { font-family: Georgia, "Songti SC", "Hiragino Mincho ProN", "Noto Serif CJK SC", "Source Han Serif SC", SimSun, serif; }';
              return;
            }
            var family = null;
            if (choice.preset === "custom" && typeof choice.family === "string" && choice.family.trim().length > 0 && choice.family.trim().length <= 100 && !/[\u0000-\u001f\u007f,;{}<>]/u.test(choice.family)) family = choice.family.trim();
            else if (typeof choice.preset === "string" && Object.hasOwn(presets[kind], choice.preset)) family = presets[kind][choice.preset];
            if (!family) return;
            var first = choice.preset === "system" ? family : '"' + family.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
            declarations.push("--font-" + kind + ": " + first + ", " + (document.documentElement.style.getPropertyValue("--font-" + kind) || fallbacks[kind]) + " !important;");
            if (kind === "mono") declarations.push("--font-inline-code: var(--font-mono);");
          });
          var fontStyle = document.getElementById("persona-font");
          if (!declarations.length && !prose) {
            if (fontStyle) fontStyle.remove();
            return;
          }
          if (!fontStyle) {
            fontStyle = document.createElement("style");
            fontStyle.id = "persona-font";
            document.head.appendChild(fontStyle);
          }
          var css = (declarations.length ? ":root { " + declarations.join(" ") + " }" : "") + prose;
          if (fontStyle.textContent !== css) fontStyle.textContent = css;
        }
        refreshFonts();
        addEventListener("storage", function (event) {
          if (event.key === null || event.key === "persona.font") refreshFonts();
        });
        // Also keep the chosen family ahead of the defaults applied by a late theme change.
        new MutationObserver(refreshFonts).observe(document.documentElement, { attributes: true, attributeFilter: ["style"] });
      })();
    </script>
  </head>
  <body>
    <!-- 100dvh: the visible height with the browser's bars, not the tallest one (100vh hides the bottom on phones) -->
    <div id="root" style="height: 100dvh"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
