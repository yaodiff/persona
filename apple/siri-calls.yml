# "Call Persona using Persona" through SiriKit (#9290, docs/apple/siri.md「Calling Persona」): an Intents extension that hands
# Siri's call intent to the app. Merged into project.yml by its `include:` (enable: ${PERSONA_SIRI_CALLS}), which
# scripts/persona_config.py env sets to YES only when config.json app.siri_calls is true; the same switch adds SIRIKIT
# plus this extension's App ID and profile to scripts/release/asc_signing.py. Off by default: no extension, no Siri
# entitlement, no PersonaSiriCalls flag, so the project, the signing preflight and the release are as they were
# (NSSiriUsageDescription stays in project.yml for ITMS-90683 because the iOS app always links Intents, without
# prompting for Siri when the switch is off).
# Why it is opt-in: the extension needs its own App ID and App Store profile, and the app's App ID needs SIRIKIT, which
# only the account's maintainer can set up (docs/operations/release.md「Siri calls」); merged on without them, the release
# preflight (asc_signing.py --check) stops the unattended TestFlight build. The App Shortcut "Call Persona"
# (CallPersonaIntent) needs none of it and is always there.
# Dictionaries merge and arrays append, so the keys here add to the ones in project.yml. Nothing tracked is rewritten
# with it on (an unattended release needs its worktree clean): the app signs with a generated entitlements file and its
# Info.plist keys go into the built one.
targets:
  Persona:
    dependencies:
      - target: PersonaCallIntents
    sources:
      # Siri's example phrases for the call intent, in every language the app has: App Store Connect rejects a build
      # with SiriKit intents and no examples for one of them (ITMS-90626). In the app's bundle, not the extension's.
      - path: PersonaCallIntents/Vocabulary
        buildPhase: resources
    # Signed with a generated copy of the app's entitlements plus Siri's (git-ignored): this path wins over
    # app-entitlements.yml's, included before, and the properties merge with project.yml's. The tracked
    # Persona/Resources/Persona.entitlements is not rewritten, so a release's worktree stays clean.
    entitlements:
      path: PersonaSiriCalls.entitlements
      properties:
        com.apple.developer.siri: true
    # PersonaSiriCalls (SiriCalls.builtIn: the build has the extension, so the app asks for Siri), put into the built
    # Info.plist before it is signed, as the commit stamp is: the tracked Persona/Resources/Info.plist stays as it is
    # (and already carries NSSiriUsageDescription from project.yml).
    postBuildScripts:
      - name: Siri calls in the Info.plist
        basedOnDependencyAnalysis: false
        inputFiles: ["$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)"]
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          plutil -replace PersonaSiriCalls -bool YES "$plist"
  PersonaCallIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: PersonaCallIntents
        excludes: ["*.plist", "Vocabulary/**"]
    settings:
      base:
        # Derived from the configured app id, like the other extensions (asc_signing.py CALL_INTENTS).
        PRODUCT_BUNDLE_IDENTIFIER: $(PERSONA_BUNDLE_ID).callintents
        PRODUCT_MODULE_NAME: PersonaCallIntents
        PRODUCT_NAME: PersonaCallIntents
        INFOPLIST_FILE: PersonaCallIntents/Info.plist
        # SiriKit calls the handler on its own queue.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        # No entitlements: the Siri one is the app's (Apple: the containing app has it, the extension does not).
